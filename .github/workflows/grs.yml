name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=giuseppe99barchetta&show_icons=true&count_private=true&theme=tokyonight&include_all_commits=true&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.MY_PAT }}
          
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=giuseppe99barchetta&layout=compact&langs_count=6&theme=tokyonight&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.MY_PAT }}

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=giuseppe99barchetta&repo=suggestarr&theme=tokyonight
          path: profile/pin-project.svg
          token: ${{ secrets.MY_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
